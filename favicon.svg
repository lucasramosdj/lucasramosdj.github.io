<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- fondo de la portada -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a7772"/><stop offset=".55" stop-color="#a3aaa5"/><stop offset="1" stop-color="#cdd6d0"/>
    </linearGradient>
    <!-- cromado de "RAMOS" -->
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="17" x2="0" y2="47">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#eef2ef"/><stop offset=".55" stop-color="#9aa29c"/>
      <stop offset=".72" stop-color="#ffffff"/><stop offset="1" stop-color="#c3cac5"/>
    </linearGradient>
    <!-- negro con brillos, como cromo negro -->
    <linearGradient id="blackchrome" gradientUnits="userSpaceOnUse" x1="0" y1="17" x2="0" y2="47">
      <stop offset="0" stop-color="#5d6460"/><stop offset=".3" stop-color="#151816"/><stop offset=".5" stop-color="#000000"/>
      <stop offset=".62" stop-color="#7c8480"/><stop offset=".74" stop-color="#1a1d1b"/><stop offset="1" stop-color="#3a403c"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy=".8" stdDeviation=".9" flood-color="#1c201e" flood-opacity=".35"/></filter>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <!-- trazo fino y ancho, como la tipografía de la portada -->
  <path d="M11 18v28h17" fill="none" stroke="url(#blackchrome)" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M35 46V18h13a6 6 0 0 1 6 6v2a6 6 0 0 1-6 6H35M45 32l10 14" fill="none" stroke="url(#chrome)" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter" filter="url(#sh)"/>
</svg>
